name: 설정 · 기타 작업
description: 빌드, 의존성, 환경 설정, 배포 등 기능 외 작업
title: "[작업코드] "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        제목 예: `[be01] 시연 서버 배포`, `[fe01] 프론트 기본 세팅`
        새 라이브러리 추가는 팀 확인이 필요합니다. (AGENTS.md 2장)
  - type: dropdown
    id: code
    attributes:
      label: 작업코드
      options: [be01, be02, be03, be04, be05, be06, fe01, fe02, fe03, fe04, fe05, fe06]
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: 작업 내용
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      value: |
        - [ ]
  - type: textarea
    id: notice
    attributes:
      label: 팀원 공지 사항
      description: "이 작업 후 팀원이 따로 해야 할 일 (예: npm install 다시 하기, application-local.yml 에 값 추가)"
